name: RaceDay API CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore RaceDay/RaceDay.slnx

      - name: Build
        run: dotnet build RaceDay/RaceDay.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test RaceDay/RaceDay.slnx --no-build --configuration Release --verbosity normal
